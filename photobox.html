<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture the moment</title>
    <link rel="icon" type="image/png" href="assets/birthday.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap');
         :root {
            --bg-color: #fdfaf6;
            --black: #1a1a1a;
            --yellow: #ffde59;
            --green: #00bf63;
            --pink: #ff99c2;
            --blue: #5ce1e6;
            --red: #ff4757;
            --border-width: 3px;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--blue) 5px, transparent 5px), radial-gradient(var(--pink) 5px, transparent 5px), radial-gradient(var(--yellow) 5px, transparent 5px), radial-gradient(var(--red) 5px, transparent 5px);
            background-size: 80px 80px;
            background-position: 0 0, 40px 40px, 0 40px, 40px 0;
            animation: moveDots 6s linear infinite;
            color: var(--black);
            padding: 20px;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        @keyframes moveDots {
            0% {
                background-position: 0 0, 40px 40px, 0 40px, 40px 0;
            }
            100% {
                background-position: 80px 80px, 120px 120px, 80px 120px, 120px 80px;
            }
        }
        
        .brutal-box {
            background-color: white;
            border: var(--border-width) solid var(--black);
            border-radius: 12px;
            box-shadow: 6px 6px 0px var(--black);
            transition: all 0.2s;
        }
        
        .brutal-button {
            background-color: var(--yellow);
            color: var(--black);
            font-weight: 700;
            padding: 12px 24px;
            border: var(--border-width) solid var(--black);
            border-radius: 30px;
            box-shadow: 4px 4px 0px var(--black);
            cursor: pointer;
            display: inline-flex;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            justify-content: center;
            align-items: center;
        }
        
        .brutal-button.blue {
            background-color: var(--blue);
        }
        
        .brutal-button.pink {
            background-color: var(--pink);
        }
        
        .brutal-button.green {
            background-color: var(--green);
        }
        
        .brutal-button:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--black);
        }
        
        .brutal-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            font-size: 26px;
            font-weight: 900;
            display: flex;
            align-items: center;
        }
        
        #typing-text {
            font-weight: 900;
            font-size: 28px;
            margin-left: 8px;
            padding-right: 2px;
            display: inline-block;
            color: var(--black);
        }
        
        #typing-text span {
            display: inline-block;
            transition: transform 0.1s;
        }
        
        #typing-text span:hover {
            transform: translateY(-3px);
        }
        
        .cursor {
            display: inline-block;
            font-weight: 900;
            font-size: 28px;
            color: var(--black);
            margin-left: 5px;
            animation: blink 0.7s infinite;
        }
        
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        
        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        nav button {
            background: white;
            border: 2px solid var(--black);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            color: var(--black);
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0px var(--black);
        }
        
        nav button:hover {
            background-color: var(--yellow);
            transform: translateY(-2px);
            box-shadow: 3px 3px 0px var(--black);
        }
        
        nav button.active-nav {
            background-color: var(--blue);
            box-shadow: 2px 2px 0px var(--black);
        }
        
        nav button.prank-btn {
            background-color: var(--red);
            color: white;
        }
        
        .photobox-container {
            position: relative;
            background-color: white;
            padding: 40px 30px 30px 30px;
            text-align: center;
            flex: 1;
            background-image: radial-gradient(rgba(0, 0, 0, 0.06) 2px, transparent 2px);
            background-size: 20px 20px;
        }
        
        .photobox-container h2 {
            font-size: 32px;
            font-weight: 900;
            color: var(--black);
            text-transform: uppercase;
            -webkit-text-stroke: 1px var(--black);
            text-shadow: 3px 3px 0px var(--yellow);
        }
        
        .brutal-tape {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 140px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.7);
            border: 3px solid var(--black);
            box-shadow: 3px 3px 0px var(--black);
            backdrop-filter: blur(4px);
            z-index: 20;
        }
        
        .brutal-stamp {
            position: absolute;
            top: -20px;
            right: -20px;
            background-color: var(--pink);
            color: var(--black);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 900;
            font-size: 16px;
            line-height: 1.1;
            border: 4px solid var(--black);
            border-radius: 50%;
            box-shadow: 4px 4px 0px var(--black);
            transform: rotate(15deg);
            z-index: 15;
            animation: ornamentBounce 3s ease-in-out infinite;
        }
        
        @keyframes ornamentBounce {
            0%,
            100% {
                transform: translateY(0) rotate(15deg);
            }
            50% {
                transform: translateY(-5px) rotate(5deg);
            }
        }
        
        .brutal-sparkle {
            position: absolute;
            z-index: 10;
            animation: sparklePop 1.5s infinite alternate ease-in-out;
            pointer-events: none;
            filter: drop-shadow(4px 4px 0px var(--black));
        }
        
        .brutal-sparkle.s1 {
            top: 20px;
            left: -25px;
            width: 60px;
            height: 60px;
            --rot: 15deg;
            animation-delay: 0s;
        }
        
        .brutal-sparkle.s2 {
            bottom: 40px;
            right: -20px;
            width: 50px;
            height: 50px;
            --rot: -15deg;
            animation-delay: 0.5s;
        }
        
        .brutal-sparkle.s3 {
            bottom: 30px;
            left: -15px;
            width: 45px;
            height: 45px;
            --rot: 30deg;
            animation-delay: 1s;
        }
        
        @keyframes sparklePop {
            0% {
                transform: scale(0.8) rotate(var(--rot));
            }
            100% {
                transform: scale(1.15) rotate(calc(var(--rot) + 20deg));
            }
        }
        
        .options-section {
            position: relative;
            z-index: 5;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #fff8f0;
            border: var(--border-width) solid var(--black);
            border-radius: 12px;
            box-shadow: 4px 4px 0px var(--black);
            text-align: left;
        }
        
        .options-group {
            display: flex;
            flex-direction: column;
        }
        
        .options-title {
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--black);
        }
        
        .options-title span.badge {
            background: var(--black);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
        }
        
        .option-card {
            background: white;
            border: 2px solid var(--black);
            border-radius: 10px;
            padding: 10px 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0px var(--black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .option-card:hover {
            transform: translateY(-2px);
            box-shadow: 3px 3px 0px var(--black);
            background: #fafafa;
        }
        
        .option-card.active {
            background: var(--yellow);
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--black);
        }
        
        .option-card.disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(100%);
            box-shadow: none;
            transform: translate(2px, 2px);
        }
        
        .option-card.disabled-frame {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(100%);
            box-shadow: none;
            transform: translate(2px, 2px);
            background: #eee;
        }
        
        .color-picker-container {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 10px 15px;
            background: white;
            border: 2px solid var(--black);
            border-radius: 8px;
            box-shadow: 2px 2px 0px var(--black);
        }
        
        .color-picker-container label {
            font-size: 13px;
            font-weight: 700;
        }
        
        .color-picker-container input[type="color"] {
            border: 2px solid var(--black);
            border-radius: 4px;
            width: 35px;
            height: 35px;
            cursor: pointer;
            background: transparent;
        }
        
        .photobox-main {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            z-index: 5;
        }
        
        .camera-section {
            flex: 1;
            max-width: 540px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .camera-wrapper {
            background: #f0f0f0;
            padding: 20px;
            border: var(--border-width) solid var(--black);
            border-radius: 12px;
            box-shadow: 8px 8px 0px var(--black);
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        
        .polaroid-frame {
            background: white;
            padding: 15px 15px 35px 15px;
            border: 3px solid var(--black);
            position: relative;
            width: 100%;
            max-width: 100%;
            transition: background-color 0.3s ease;
        }
        
        .media-container {
            position: relative;
            margin: 0 auto;
            border: 3px solid var(--black);
            border-radius: 4px;
            overflow: hidden;
            background: #000;
            transition: all 0.3s ease;
            width: 100%;
            aspect-ratio: 672 / 504;
        }
        
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: none;
        }
        
        #photo-canvas {
            display: none;
        }
        
        #frame-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: none;
            background-position: center;
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }
        
        #final-result-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 20;
            background: white;
            display: none;
        }
        
        #countdown-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 110px;
            font-weight: 900;
            color: var(--yellow);
            -webkit-text-stroke: 4px var(--black);
            text-shadow: 6px 6px 0px var(--black);
            z-index: 25;
            display: none;
            pointer-events: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes popIn {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
        
        .photo-text {
            position: absolute;
            bottom: 8px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
        
        .photobox-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
        }
        
        .photobox-main.finished-layout {
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        .camera-section.finished-camera {
            width: 100%;
            max-width: 900px;
        }
        
        .finished-wrapper {
            width: 100%;
            padding: 20px;
        }
        
        .finished-media {
            aspect-ratio: auto;
            width: min(100%, 800px);
            margin: 0 auto;
            background: #fff;
            border: none;
            border-radius: 0;
            overflow: visible;
        }
        
        .finished-media #final-result-img {
            position: relative;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: calc(100vh - 300px);
            object-fit: contain;
            display: block;
            margin: 0 auto;
            background: transparent;
        }
        
        @media (min-width: 769px) {
            .photobox-main.finished-layout .finished-media {
                width: 100%;
                height: calc(100vh - 300px);
                max-height: calc(100vh - 300px);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .photobox-main.finished-layout .finished-media #final-result-img {
                width: auto;
                height: auto;
                max-width: 100%;
                max-height: 100%;
            }
        }
        
        .finished-media #camera-feed,
        .finished-media #countdown-overlay,
        .finished-media #frame-overlay {
            display: none !important;
        }
        
        .results-sidebar.finished-sidebar {
            display: none !important;
        }
        
        .results-sidebar {
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .result-slot {
            background-color: #f0f0f0;
            border: 3px solid var(--black);
            border-radius: 8px;
            box-shadow: 4px 4px 0px var(--black);
            aspect-ratio: 672 / 504;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 6px;
        }
        
        .result-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: 2px solid var(--black);
            border-radius: 4px;
            background: #fff;
            transform: none;
        }
        
        .slot-placeholder {
            font-weight: bold;
            color: #1a1a1a;
            font-size: 14px;
            opacity: 0.5;
        }
        
        footer {
            margin-top: 40px;
            background-color: var(--yellow);
            border: var(--border-width) solid var(--black);
            border-radius: 12px;
            padding: 15px 20px;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 6px 6px 0px var(--black);
            color: var(--black);
        }
        
        .ig-link {
            color: var(--black);
            text-decoration: none;
            border-bottom: 2px solid var(--black);
            transition: all 0.2s ease;
        }
        
        .ig-link:hover {
            color: var(--red);
            border-bottom-color: var(--red);
            background-color: white;
        }
        
        @media (min-width: 769px) {
            .photobox-main.finished-layout {
                min-height: 0;
                justify-content: flex-start;
                padding-bottom: 10px;
            }
            .camera-section.finished-camera {
                max-width: min(760px, 88vw);
            }
            .finished-wrapper {
                padding: 10px;
            }
            .finished-media {
                width: auto;
                max-width: min(760px, 62vh);
                max-height: 62vh;
                margin: 0 auto;
            }
            .finished-media #final-result-img {
                width: auto;
                max-width: 100%;
                max-height: 62vh;
                height: auto;
                object-fit: contain;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 15px;
            }
            .logo {
                font-size: 16px;
                flex-wrap: wrap;
                justify-content: center;
                line-height: 1.5;
            }
            #typing-text {
                font-size: 22px;
                margin-left: 5px;
            }
            .cursor {
                font-size: 22px;
            }
            nav {
                justify-content: center;
                gap: 8px;
                width: 100%;
            }
            nav button {
                padding: 8px 12px;
                font-size: 12px;
                flex: 1 1 calc(50% - 10px);
                max-width: max-content;
            }
            nav button.prank-btn {
                flex: 1 1 100%;
                max-width: 100%;
                margin-top: 4px;
            }
            .options-section {
                grid-template-columns: 1fr;
            }
            .photobox-main {
                flex-direction: column;
                align-items: center;
            }
            .results-sidebar {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            .photobox-controls {
                flex-direction: column;
                width: 100%;
            }
            .photobox-controls .brutal-button {
                width: 100%;
            }
            .brutal-stamp {
                width: 60px;
                height: 60px;
                font-size: 12px;
                top: -10px;
                right: -10px;
            }
            .brutal-sparkle.s1 {
                width: 40px;
                height: 40px;
                left: -10px;
            }
            .brutal-sparkle.s2 {
                width: 35px;
                height: 35px;
                right: -10px;
            }
            .brutal-sparkle.s3 {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header class="brutal-box">
        <div class="logo">✨ Happy Sweet 17th<span id="typing-text"></span><span class="cursor">|</span></div>
        <nav>
            <button onclick="window.location.href='index.html'">Home</button>
            <button onclick="window.location.href='message.html'">Pesan</button>
            <button onclick="window.location.href='cake.html'">Kue 3D</button>
            <button class="active-nav" onclick="window.location.href='photobox.html'">Photobox</button>
            <button class="prank-btn" onclick="window.location.href='gift.html'">Hadiah? 🎁</button>
        </nav>
    </header>

    <div class="photobox-container brutal-box">
        <div class="brutal-tape"></div>
        <div class="brutal-stamp">SMILE!</div>

        <svg class="brutal-sparkle s1" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 5 L60 40 L95 50 L60 60 L50 95 L40 60 L5 50 L40 40 Z" fill="var(--yellow)" stroke="var(--black)" stroke-width="8" stroke-linejoin="round"/>
        </svg>
        <svg class="brutal-sparkle s2" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 5 L60 40 L95 50 L60 60 L50 95 L40 60 L5 50 L40 40 Z" fill="var(--pink)" stroke="var(--black)" stroke-width="8" stroke-linejoin="round"/>
        </svg>
        <svg class="brutal-sparkle s3" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 5 L60 40 L95 50 L60 60 L50 95 L40 60 L5 50 L40 40 Z" fill="var(--blue)" stroke="var(--black)" stroke-width="8" stroke-linejoin="round"/>
        </svg>

        <h2 style="margin-bottom: 5px;">📸Jangan Lupa Abadikan Momentmu!</h2>
        <p style="margin-bottom: 25px; font-weight: 500;"> Abadikan dulu gayamu, lalu pilih Frame kesukaanmu setelahnya!</p>

        <div class="options-section">
            <div class="options-group">
                <div class="options-title"><span class="badge">1</span> Pilih Mode Foto</div>
                <div class="options-grid" style="grid-template-columns: 1fr 1fr;">
                    <button class="option-card" id="mode-strip" onclick="setMode('strip', this)">
                        <span style="font-size: 20px;">🎞️</span>
                        <span>Photobox Strip</span>
                        <small style="font-size: 10px; opacity: 0.8; font-weight: normal;">(3 Foto Vertikal)</small>
                    </button>
                    <button class="option-card active" id="mode-single" onclick="setMode('single', this)">
                        <span style="font-size: 20px;">🖼️</span>
                        <span>Foto Tunggal</span>
                        <small style="font-size: 10px; opacity: 0.8; font-weight: normal;">(1 Foto Utama)</small>
                    </button>
                </div>
            </div>

            <div class="options-group">
                <div class="options-title"><span class="badge">2</span> Pilih Frame Desain</div>
                <div class="options-grid" id="frame-options-grid">
                    <button class="option-card" id="frame-none" data-frametype="all" onclick="changeFrame('none', this, '')">
                        <span>Tanpa Frame</span>
                    </button>
                    <button class="option-card active" id="frame-1" data-frametype="single" onclick="changeFrame('frame1', this, 'assets/frame1.png')">
                        <span>Frame 1 (Single)</span>
                    </button>
                    <button class="option-card" id="frame-2" data-frametype="single" onclick="changeFrame('frame2', this, 'assets/frame2.png')">
                        <span>Frame 2 (Single)</span>
                    </button>
                    <button class="option-card" id="frame-strip-1" data-frametype="strip" onclick="changeFrame('frame_strip1', this, 'assets/frame_labuanbajo1.png')">
                        <span>Labuan Bajoo</span>
                    </button>
                    <button class="option-card" id="frame-strip-2" data-frametype="strip" onclick="changeFrame('frame_strip2', this, 'assets/frame_labuanbajo3.png')">
                        <span>Labuan Bajo</span>
                    </button>
                    <button class="option-card" id="frame-strip-3" data-frametype="strip" onclick="changeFrame('frame_strip3', this, 'assets/frame_jakarta1.png')">
                        <span>Jakarta </span>
                    </button>
                    <button class="option-card" id="frame-strip-4" data-frametype="strip" onclick="changeFrame('frame_strip4', this, 'assets/frame_jakarta2.png')">
                        <span>Jakartaa </span>
                    </button>
                    <button class="option-card" id="frame-strip-5" data-frametype="strip" onclick="changeFrame('frame_strip5', this, 'assets/frame_zona1.png')">
                        <span>TimeZone</span>
                    </button>
                    <button class="option-card" id="frame-strip-6" data-frametype="strip" onclick="changeFrame('frame_strip6', this, 'assets/frame_zona2.png')">
                        <span>TimeZonee</span>
                    </button>
                    <button class="option-card" id="frame-strip-7" data-frametype="strip" onclick="changeFrame('frame_strip7', this, 'assets/frame_loyola2.png')">
                        <span>Loyola</span>
                    </button>
                    <button class="option-card" id="frame-strip-8" data-frametype="strip" onclick="changeFrame('frame_strip8', this, 'assets/frame_NTT.png')">
                        <span>NTT</span>
                    </button>
                    <button class="option-card" id="frame-strip-9" data-frametype="strip" onclick="changeFrame('frame_strip9', this, 'assets/frame_food.png')">
                        <span>Happy Food</span>
                    </button>
                </div>

                <div class="color-picker-container" id="color-picker-box">
                    <label for="frame-color">Warna Polos:</label>
                    <input type="color" id="frame-color" value="#ffffff" onchange="updateCustomColor(this.value)">
                </div>
            </div>
        </div>

        <div class="photobox-main">
            <div class="camera-section">
                <div class="camera-wrapper" id="cam-wrapper">
                    <div class="polaroid-frame" id="polaroid-frame-element">
                        <div class="media-container" id="media-container">
                            <video id="camera-feed" autoplay playsinline></video>
                            <canvas id="photo-canvas"></canvas>
                            <div id="frame-overlay" style="display: block; background-image: url('assets/frame1.png');"></div>

                            <img id="final-result-img" alt="Hasil Akhir">

                            <div id="countdown-overlay">3</div>
                        </div>
                    </div>
                </div>

                <div class="photobox-controls">
                    <button class="brutal-button blue" id="btn-start-cam" onclick="startCamera()">📷 Nyalakan Kamera</button>
                    <button class="brutal-button pink" id="btn-snap" onclick="startSnapCountdown()" style="display:none;">📸 Take a Picture (<span id="photo-count">0</span>/<span id="max-count">1</span>)</button>

                    <button class="brutal-button" id="btn-reset" onclick="resetPhotos()" style="display:none;">🔄 Ulangi</button>
                    <button class="brutal-button green" id="btn-download" onclick="downloadPhoto()" style="display:none;">⬇️ Unduh</button>
                </div>
            </div>

            <div class="results-sidebar" id="results-sidebar">
                <div class="result-slot brutal-box" id="slot-1">
                    <span class="slot-placeholder" id="placeholder-1">Foto 1</span>
                    <img id="img-1" style="display:none;" alt="Foto 1">
                </div>
                <div class="result-slot brutal-box" id="slot-2" style="display:none;">
                    <span class="slot-placeholder" id="placeholder-2">Foto 2</span>
                    <img id="img-2" style="display:none;" alt="Foto 2">
                </div>
                <div class="result-slot brutal-box" id="slot-3" style="display:none;">
                    <span class="slot-placeholder" id="placeholder-3">Foto 3</span>
                    <img id="img-3" style="display:none;" alt="Foto 3">
                </div>
            </div>
        </div>
    </div>


    <footer>
        &copy; 2026 Hak Cipta Fans Number One | Dibuat untuk membuatnya tersenyum dihari bahagianya 💖
        <a href="https://www.instagram.com/sofwan_a/" target="_blank" class="ig-link">s</a>
    </footer>

    <script>
        const names = ["Dita Suciadi", "Louise Margareth", "Hellen Moudjie"];
        let nameIndex = 0,
            charIndex = 0,
            isDeleting = false;
        const typingElement = document.getElementById("typing-text");

        function typeEffectName() {
            const currentName = names[nameIndex];
            let currentText = "";

            if (isDeleting) {
                currentText = currentName.substring(0, charIndex - 1);
                charIndex--;
            } else {
                currentText = currentName.substring(0, charIndex + 1);
                charIndex++;
            }

            let plainHTML = "";
            for (let i = 0; i < currentText.length; i++) {
                if (currentText[i] === " ") {
                    plainHTML += " ";
                } else {
                    plainHTML += `<span>${currentText[i]}</span>`;
                }
            }

            typingElement.innerHTML = plainHTML;

            let typeSpeed = isDeleting ? 100 : 150;

            if (!isDeleting && charIndex === currentName.length) {
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                nameIndex = (nameIndex + 1) % names.length;
                typeSpeed = 500;
            }
            setTimeout(typeEffectName, typeSpeed);
        }

        document.addEventListener("DOMContentLoaded", () => {
            typeEffectName();
            setMode('single', document.getElementById('mode-single'));
        });

        // PHOTOBOX LOGIC
        const video = document.getElementById('camera-feed');
        const photoCanvas = document.getElementById('photo-canvas');
        const ctx = photoCanvas.getContext('2d');
        const frameOverlay = document.getElementById('frame-overlay');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const photoTextDisplay = document.getElementById('photo-text-display') || {
            style: {
                display: ''
            }
        };
        const finalResultImg = document.getElementById('final-result-img');
        const polaroidFrameElem = document.getElementById('polaroid-frame-element');
        const colorPickerBox = document.getElementById('color-picker-box');
        const frameColorInput = document.getElementById('frame-color');

        let currentFrameType = 'frame1';
        let currentFramePath = 'assets/frame1.png';
        let customBgColor = '#ffffff';
        let captureMode = 'single';
        let maxPhotos = 1;
        let capturedPhotos = [];
        let isCountingDown = false;
        let finalImageDataUrl = '';
        let isFinished = false;

        function loadImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        function setMode(mode, btn) {
            document.getElementById('mode-strip').classList.remove('active');
            document.getElementById('mode-single').classList.remove('active');
            if (btn) btn.classList.add('active');

            captureMode = mode;
            maxPhotos = mode === 'strip' ? 3 : 1;
            document.getElementById('max-count').textContent = maxPhotos;

            document.getElementById('results-sidebar').style.display = 'flex';

            if (mode === 'strip') {
                document.getElementById('slot-2').style.display = 'flex';
                document.getElementById('slot-3').style.display = 'flex';
                frameOverlay.style.display = 'none';
            } else {
                document.getElementById('slot-2').style.display = 'none';
                document.getElementById('slot-3').style.display = 'none';
                if (currentFrameType !== 'none') frameOverlay.style.display = 'block';
            }

            document.querySelectorAll('.options-group:nth-child(2) .option-card').forEach(card => {
                const fType = card.getAttribute('data-frametype');
                const available = fType === 'all' || fType === mode;

                card.classList.toggle('disabled-frame', !available);

                if (!available) {
                    card.classList.remove('active');
                }
            });

            const activeFrame = document.querySelector('.options-group:nth-child(2) .option-card.active');
            const activeType = activeFrame ? activeFrame.getAttribute('data-frametype') : null;

            if (!activeFrame || (activeType !== 'all' && activeType !== mode)) {
                const firstAvailable = document.querySelector(
                    `.options-group:nth-child(2) .option-card[data-frametype="${mode}"]`
                );
                if (firstAvailable) {
                    firstAvailable.click();
                } else {
                    document.getElementById('frame-none').click();
                }
            }

            resetPhotos();
        }

        function changeFrame(type, btn, imgPath = '') {
            document.querySelectorAll('.options-group:nth-child(2) .option-card').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');

            currentFrameType = type;
            currentFramePath = imgPath;

            if (type === 'none') {
                photoTextDisplay.style.display = 'block';
                frameOverlay.style.backgroundImage = 'none';
                frameOverlay.style.display = 'none';
                colorPickerBox.style.display = 'flex';
                polaroidFrameElem.style.backgroundColor = customBgColor;
            } else {
                photoTextDisplay.style.display = 'none';
                colorPickerBox.style.display = 'none';
                polaroidFrameElem.style.backgroundColor = 'white';
                frameOverlay.style.backgroundImage = `url('${imgPath}')`;

                frameOverlay.style.display = captureMode === 'single' ? 'block' : 'none';
            }

            if (capturedPhotos.length === maxPhotos) {
                generateFinalImage();
            }
        }

        function updateCustomColor(colorVal) {
            customBgColor = colorVal;
            if (currentFrameType === 'none') {
                polaroidFrameElem.style.backgroundColor = customBgColor;
                if (capturedPhotos.length === maxPhotos) {
                    generateFinalImage();
                }
            }
        }

        async function startCamera() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('getUserMedia tidak tersedia');
                }

                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: {
                            ideal: 672
                        },
                        height: {
                            ideal: 504
                        },
                        facingMode: 'user'
                    },
                    audio: false
                });

                video.srcObject = stream;
                video.muted = true;
                video.autoplay = true;
                video.playsInline = true;

                await new Promise((resolve, reject) => {
                    if (video.readyState >= 2 && video.videoWidth > 0) {
                        resolve();
                        return;
                    }

                    const onLoaded = () => {
                        cleanup();
                        resolve();
                    };
                    const onError = () => {
                        cleanup();
                        reject(new Error('Video kamera gagal dimuat'));
                    };
                    const cleanup = () => {
                        video.removeEventListener('loadedmetadata', onLoaded);
                        video.removeEventListener('error', onError);
                    };

                    video.addEventListener('loadedmetadata', onLoaded, {
                        once: true
                    });
                    video.addEventListener('error', onError, {
                        once: true
                    });
                });

                await video.play();

                document.getElementById('btn-start-cam').style.display = 'none';
                const snapBtn = document.getElementById('btn-snap');
                snapBtn.style.display = 'inline-flex';
                snapBtn.disabled = false;
            } catch (err) {
                console.error('Gagal menyalakan kamera:', err);
                alert("Kamera tidak dapat digunakan. Izinkan akses kamera dan jalankan halaman melalui HTTPS atau localhost/Live Server.");
            }
        }

        function startSnapCountdown() {
            if (isCountingDown || capturedPhotos.length >= maxPhotos) return;
            isCountingDown = true;
            const snapBtn = document.getElementById('btn-snap');
            snapBtn.disabled = true;

            let count = 3;
            countdownOverlay.textContent = count;
            countdownOverlay.style.display = 'block';

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownOverlay.textContent = count;
                    countdownOverlay.style.animation = 'none';
                    countdownOverlay.offsetHeight;
                    countdownOverlay.style.animation = 'popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                } else {
                    clearInterval(timer);
                    countdownOverlay.style.display = 'none';
                    isCountingDown = false;
                    snapPhoto().finally(() => {
                        if (capturedPhotos.length < maxPhotos) {
                            snapBtn.disabled = false;
                        }
                    });
                }
            }, 1000);
        }

        async function snapPhoto() {
            if (!video.srcObject || video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
                alert("Kamera belum siap. Tunggu sampai tampilan kamera muncul, lalu coba lagi.");
                return;
            }

            if (capturedPhotos.length === 0) {
                document.querySelectorAll('.options-group:first-child .option-card').forEach(card => card.classList.add('disabled'));
            }

            let targetWidth = 672;
            let targetHeight = 504;

            photoCanvas.width = targetWidth;
            photoCanvas.height = targetHeight;

            const videoRatio = video.videoWidth / video.videoHeight;
            const targetRatio = targetWidth / targetHeight;

            let drawWidth = video.videoWidth;
            let drawHeight = video.videoHeight;
            let offsetX = 0;
            let offsetY = 0;

            if (videoRatio > targetRatio) {
                drawWidth = video.videoHeight * targetRatio;
                offsetX = (video.videoWidth - drawWidth) / 2;
            } else {
                drawHeight = video.videoWidth / targetRatio;
                offsetY = (video.videoHeight - drawHeight) / 2;
            }

            ctx.save();
            ctx.drawImage(video, offsetX, offsetY, drawWidth, drawHeight, 0, 0, targetWidth, targetHeight);
            ctx.restore();

            try {
                const photoData = photoCanvas.toDataURL('image/jpeg', 0.9);
                capturedPhotos.push(photoData);

                const index = capturedPhotos.length;
                document.getElementById('photo-count').textContent = index;

                document.getElementById(`img-${index}`).src = photoData;
                document.getElementById(`img-${index}`).style.display = 'block';
                document.getElementById(`placeholder-${index}`).style.display = 'none';

                if (capturedPhotos.length === maxPhotos) {
                    document.getElementById('btn-snap').style.display = 'none';
                    generateFinalImage();
                }
            } catch (err) {
                alert("⚠️ GAGAL MEMPROSES! Pastikan menggunakan Live Server.");
            }
        }

        async function generateFinalImage() {
            const finalCanvas = document.createElement('canvas');
            const sCtx = finalCanvas.getContext('2d');

            try {
                const photoImgs = await Promise.all(capturedPhotos.map(src => loadImage(src)));
                let frameImg = null;

                if (currentFrameType !== 'none' && currentFramePath) {
                    frameImg = await loadImage(currentFramePath);
                }

                if (captureMode === 'single') {
                    const rawImg = photoImgs[0];
                    finalCanvas.width = rawImg.width;
                    finalCanvas.height = rawImg.height;

                    sCtx.clearRect(0, 0, finalCanvas.width, finalCanvas.height);

                    sCtx.drawImage(rawImg, 0, 0);
                    if (frameImg) {
                        sCtx.drawImage(frameImg, 0, 0, finalCanvas.width, finalCanvas.height);
                    }
                } else {

                    const canvasW = 890;
                    const canvasH = 1767;

                    finalCanvas.width = canvasW;
                    finalCanvas.height = canvasH;

                    sCtx.clearRect(0, 0, canvasW, canvasH);

                    const photoSlots = [{
                        x: 123,
                        y: 248,
                        w: 644,
                        h: 414
                    }, {
                        x: 123,
                        y: 721,
                        w: 644,
                        h: 388
                    }, {
                        x: 123,
                        y: 1171,
                        w: 645,
                        h: 362
                    }];

                    function drawPhotoCover(ctx, img, slot) {
                        if (!img) return;

                        const srcRatio = img.width / img.height;
                        const dstRatio = slot.w / slot.h;

                        let sx = 0,
                            sy = 0,
                            sw = img.width,
                            sh = img.height;

                        if (srcRatio > dstRatio) {
                            sw = img.height * dstRatio;
                            sx = (img.width - sw) / 2;
                        } else {
                            sh = img.width / dstRatio;
                            sy = (img.height - sh) / 2;
                        }

                        ctx.drawImage(
                            img,
                            sx, sy, sw, sh,
                            slot.x, slot.y, slot.w, slot.h
                        );
                    }

                    for (let j = 0; j < 3; j++) {
                        drawPhotoCover(sCtx, photoImgs[j], photoSlots[j]);
                    }

                    if (frameImg) {
                        sCtx.drawImage(frameImg, 0, 0, canvasW, canvasH);
                    }
                }

                finalImageDataUrl = finalCanvas.toDataURL('image/png');

                finalResultImg.src = finalImageDataUrl;
                finalResultImg.style.display = 'block';

                showFinishedLayout();

                document.getElementById('btn-reset').style.display = 'inline-flex';
                document.getElementById('btn-download').style.display = 'inline-flex';

            } catch (err) {
                console.error(err);
                alert("Gagal memproses gambar final.");
            }
        }

        function showFinishedLayout() {
            isFinished = true;
            document.querySelector('.photobox-main').classList.add('finished-layout');
            document.querySelector('.camera-section').classList.add('finished-camera');
            document.getElementById('results-sidebar').classList.add('finished-sidebar');
            document.getElementById('cam-wrapper').classList.add('finished-wrapper');
            document.getElementById('media-container').classList.add('finished-media');
        }

        function downloadPhoto() {
            const link = document.createElement('a');
            link.download = `photobox-${captureMode}-${currentFrameType}.png`;
            link.href = finalImageDataUrl;
            link.click();
        }

        function resetPhotos() {
            capturedPhotos = [];
            isCountingDown = false;
            isFinished = false;
            document.querySelector('.photobox-main').classList.remove('finished-layout');
            document.querySelector('.camera-section').classList.remove('finished-camera');
            document.getElementById('results-sidebar').classList.remove('finished-sidebar');
            document.getElementById('cam-wrapper').classList.remove('finished-wrapper');
            document.getElementById('media-container').classList.remove('finished-media');
            countdownOverlay.style.display = 'none';
            finalResultImg.style.display = 'none';

            for (let i = 1; i <= 3; i++) {
                const img = document.getElementById(`img-${i}`);
                const placeholder = document.getElementById(`placeholder-${i}`);
                if (img && placeholder) {
                    img.style.display = 'none';
                    placeholder.style.display = 'inline';
                }
            }

            document.getElementById('photo-count').textContent = '0';
            document.querySelectorAll('.option-card').forEach(card => card.classList.remove('disabled'));

            if (video.srcObject) {
                document.getElementById('btn-snap').style.display = 'inline-flex';
                document.getElementById('btn-snap').disabled = false;
            }
            document.getElementById('btn-reset').style.display = 'none';
            document.getElementById('btn-download').style.display = 'none';
        }
    </script>
</body>
